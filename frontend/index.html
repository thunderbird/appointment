<!doctype html>
<html lang="" data-tbpro-service="apmt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Appointment – Thunderbird</title>
    <meta
      name="description"
      content="Plan less. Do more. Thunderbird Appointment makes it easy to find a time to meet. So you can ditch the admin and streamline your day."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Appointment – Thunderbird" />
    <meta property="og:title" content="Appointment – Thunderbird" />
    <meta
      property="og:description"
      content="Plan less. Do more. Thunderbird Appointment makes it easy to find a time to meet. So you can ditch the admin and streamline your day."
    />
    <meta property="og:image" content="https://appointment.tb.pro/appointment-hero.png" />
    <meta property="og:image:alt" content="Thunderbird Appointment" />

    <script>
      // Load initial theme from the user's stored override (if any) or their
      // device colour scheme preference. Keep in sync with useColourScheme.ts.
      const storedColourScheme = localStorage?.getItem('tba/colour-scheme');
      const browserPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = storedColourScheme === 'dark' || (storedColourScheme !== 'light' && browserPrefersDark);

      document.documentElement.classList.toggle('dark', isDark);
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but this application doesn't work properly without JavaScript enabled. Please enable it to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <!-- Runtime config: sets window.__APP_CONFIG__ BEFORE the app bundle loads.
         Replaced per-environment at deploy/run time (not rebuilt). See public/config.js. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
