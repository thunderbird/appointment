<!doctype html>
<html lang="" data-tbpro-service="apmt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Thunderbird Appointment</title>
    <meta
      name="description"
      content="Plan less. Do more. Thunderbird Appointment makes it easy to find a time to meet. So you can ditch the admin and streamline your day."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thunderbird Appointment" />
    <meta property="og:title" content="Thunderbird Appointment" />
    <meta
      property="og:description"
      content="Plan less. Do more. Thunderbird Appointment makes it easy to find a time to meet. So you can ditch the admin and streamline your day."
    />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta property="og:image:alt" content="Thunderbird Appointment" />

    <script>
      // Load initial theme color scheme from user settings
      const user = JSON.parse(localStorage?.getItem('tba/user') ?? '{}');
      const browserPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (
        user.settings?.colourScheme === 'dark' ||
        (user.settings?.colourScheme === 'system' && browserPrefersDark) ||
        (!user.settings?.colourScheme && browserPrefersDark)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but this application doesn't work properly without JavaScript enabled. Please enable it to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <!-- Runtime config: sets window.__APP_CONFIG__ BEFORE the app bundle loads.
         Replaced per-environment at deploy/run time (not rebuilt). See public/config.js. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
