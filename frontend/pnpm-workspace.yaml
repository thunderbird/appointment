allowBuilds:
  '@sentry/cli': true
  core-js: true
  msw: true
  unrs-resolver: true
overrides:
  # Force a single Vue instance app-wide. @thunderbirdops/services-ui declares
  # vue as a regular dependency (not a peerDependency), so without this pnpm
  # installs a second copy; components with slots then break at runtime when
  # a vnode created by one Vue instance is rendered by the other.
  vue: 3.5.43
  postcss-selector-parser@<7.1.6: ^7.1.6
  glob@>=9.0.0 <14.0.2: ^14.0.2
  vue-i18n@<11.4.14: ^11.4.14
  "@intlify/core-base@<11.4.14": ^11.4.14
