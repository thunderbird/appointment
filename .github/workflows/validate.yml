name: validate

concurrency:
  # A newer revision of the same PR supersedes the old one. Manual runs remain
  # independent so they cannot cancel one another.
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  # Fork PRs push to the fork, never here, so `push` alone means external
  # contributions are never validated before merge. On `pull_request` from a fork
  # GitHub withholds every secret and forces GITHUB_TOKEN to read-only, and this
  # repo already requires approval for outside collaborators' runs, so each one
  # waits for a maintainer to click "Approve and run workflows".
  pull_request:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read    # This is required for actions/checkout

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      validate-iac: ${{ steps.check.outputs.validate-iac }}
      validate-backend: ${{ steps.check.outputs.validate-backend }}
      validate-frontend: ${{ steps.check.outputs.validate-frontend }}
      validate-pulumi: ${{ steps.check.outputs.validate-pulumi }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
      id: check
      with:
        filters: |
          validate-backend:
            - 'backend/**'
            - '.github/workflows/validate.yml'
          validate-frontend:
            - 'frontend/**'
            - '.github/workflows/validate.yml'
          validate-pulumi:
            - 'pulumi/**'
            - '.github/workflows/validate.yml'

  validate-backend:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.validate-backend == 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      # Install exactly what backend/uv.lock pins (hash-verified). `uv lock
      # --check` fails if the lock is stale; third-party deps install as wheels
      # only. Explicit build exceptions: hiredis 2.x and MarkupSafe 2.x publish
      # no CPython 3.13 wheels, so they build from their locked sdists (the
      # 3.12 Docker image gets wheels for both).
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv lock --check
          uv sync --frozen --extra test --no-install-project --no-build \
            --no-install-package hiredis --no-install-package markupsafe
          uv sync --frozen --extra test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test with pytest
        working-directory: ./backend
        run: |
          current_dir=$(pwd)
          coverage run --data-file $current_dir/.coverage -m pytest --disable-warnings -s

      - name: Generate code coverage report
        working-directory: ./backend
        continue-on-error: true
        run: |
          coverage report

      - name: Backend lint check
        run: |
          cd ./backend && ruff check

      - name: Backend formatting check
        run: |
          cd ./backend && ruff format --check

  validate-frontend:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.validate-frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd ./frontend
          pnpm install --frozen-lockfile

      - name: Frontend lint check
        run: |
          cd ./frontend && pnpm run lint

      - name: Build frontend
        run: |
          cd ./frontend && pnpm run build

      - name: Test with vitest
        run: |
          cd ./frontend && pnpm run test --run

  # `nginx -t` is necessary but NOT sufficient: mis-scoping an add_header or
  # breaking the /assets/ match is syntactically valid and only fails at request
  # time. A *total* root mis-scope is not the gap -- that one fails closed, since
  # / itself 404s and the rollout's readiness probe never goes green. The gap is
  # breakage confined to /assets/, or a wrong or leaked Cache-Control value on a
  # path that still returns 200: neither the readiness probe nor the synthetic
  # analysis can see those, so they promote green. Runs the shipped conf in a stock
  # nginx image over a synthetic dist tree: no npm build, no registry auth, no
  # AWS creds.
  validate-frontend-nginx:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.validate-frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test nginx config behaviour
        run: ./frontend/docker/test-nginx-config.sh

  validate-pulumi:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.validate-pulumi == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'pulumi/uv.lock'

      # Same lockfile install as the backend. tb-pulumi is a git dependency
      # (no wheel), pinned to a commit in uv.lock and built in the second step.
      - name: Install dependencies
        working-directory: ./pulumi
        run: |
          uv lock --check
          uv sync --frozen --extra dev --no-install-project --no-install-package tb-pulumi --no-build
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      
      - name: "Ruff: Format checks"
        run: |
          cd ./pulumi
          ruff format
      
      - name: "Ruff: Style/sanity checks"
        run: |
          cd ./pulumi
          ruff check

  # Branch protection should require only this stable check. The component jobs
  # are intentionally skipped when their paths are unchanged, while this job
  # still reports whether every applicable validation completed successfully.
  validate-required:
    if: always()
    needs:
      - detect-changes
      - validate-backend
      - validate-frontend
      - validate-frontend-nginx
      - validate-pulumi
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_RESULT: ${{ needs.validate-backend.result }}
          FRONTEND_RESULT: ${{ needs.validate-frontend.result }}
          FRONTEND_NGINX_RESULT: ${{ needs.validate-frontend-nginx.result }}
          PULUMI_RESULT: ${{ needs.validate-pulumi.result }}
        run: |
          if [[ "$DETECT_CHANGES_RESULT" != "success" ]]; then
            echo "detect-changes finished with: $DETECT_CHANGES_RESULT"
            exit 1
          fi

          for result in \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$FRONTEND_NGINX_RESULT" \
            "$PULUMI_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A validation job finished with: $result"
              exit 1
            fi
          done
