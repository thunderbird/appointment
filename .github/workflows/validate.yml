name: validate

concurrency:
  group: validate
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
      - '!main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    outputs:
      validate-iac: ${{ steps.check.outputs.validate-iac }}
      validate-backend: ${{ steps.check.outputs.validate-backend }}
      validate-frontend: ${{ steps.check.outputs.validate-frontend }}
      validate-pulumi: ${{ steps.check.outputs.validate-pulumi }}
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v3
      id: check
      with:
        filters: |
          validate-backend:
            - 'backend/**'
            - '.github/workflows/validate.yml'
          validate-frontend:
            - 'frontend/**'
            - '.github/workflows/validate.yml'
          validate-pulumi:
            - 'pulumi/**'
            - '.github/workflows/validate.yml'

  validate-backend:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    if: needs.detect-changes.outputs.validate-backend == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration-additivity check can diff against main
          # to find the migrations this branch ADDS.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ./backend
          python -m pip install --upgrade pip
          python -m pip install -e .'[test]'

      - name: Test with pytest
        working-directory: ./backend
        run: |
          current_dir=$(pwd)
          coverage run --data-file $current_dir/.coverage -m pytest --disable-warnings -s

      - name: Generate code coverage report
        working-directory: ./backend
        continue-on-error: true
        run: |
          coverage report

      - name: Backend lint check
        run: |
          cd ./backend && ruff check

      - name: Backend formatting check
        run: |
          cd ./backend && ruff format

      # Appointment deploys blue-green: for a window, the OLD and NEW replicas run
      # against the SAME database, and a schema change cannot be undone by aborting
      # the deploy. So a migration must only ADD ("expand"); removals ship a release
      # later ("contract"). Checked here, pre-merge, because that is the last point
      # at which the migration has not yet run anywhere.
      # Scoped to migrations this branch ADDS -- historical ones predate the gate.
      - name: Migration additivity check (expand/contract)
        working-directory: ./backend
        run: |
          git fetch --no-tags origin main
          ADDED=$(git diff --name-only --diff-filter=A --relative \
                    origin/main...HEAD -- src/appointment/migrations/versions/)
          if [ -z "$ADDED" ]; then
            echo "No new migrations in this branch - nothing to check."
            exit 0
          fi
          echo "New migrations:"; echo "$ADDED" | sed 's/^/  /'
          # shellcheck disable=SC2086
          python scripts/check_migration_additivity.py $ADDED

  validate-frontend:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    if: needs.detect-changes.outputs.validate-frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd ./frontend
          npm ci

      - name: Frontend lint check
        run: |
          cd ./frontend && npm run lint

      - name: Build frontend
        run: |
          cd ./frontend && npm run build

      - name: Test with vitest
        run: |
          cd ./frontend && npm run test -- --run

  validate-pulumi:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    if: needs.detect-changes.outputs.validate-pulumi == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ./pulumi
          python -m pip install --upgrade pip
          python -m pip install -e .'[dev]'
      
      - name: "Ruff: Format checks"
        run: |
          cd ./pulumi
          ruff format
      
      - name: "Ruff: Style/sanity checks"
        run: |
          cd ./pulumi
          ruff check
