name: deploy-production

concurrency:
  group: deploy-production
  cancel-in-progress: true

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy-prod-frontend:
    if: startsWith(github.ref_name, 'r-') # the prefix we have added to the tag
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC connecting to AWS
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Clean up before Pulumi release
        run: rm -rf dist

      - name: Get Artifact from Release
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          version: ${{ github.event.release.id }}
          file: frontend.zip

      - name: Unzip Artifact
        run: unzip frontend.zip

      - name: Deploy frontend to S3
        env:
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
          FRONTEND_CF_DISTRO_ID: ${{ secrets.FRONTEND_CF_DISTRO_ID }}
        run: |
          aws s3 sync ./dist "s3://$FRONTEND_BUCKET"
          aws cloudfront create-invalidation --distribution-id "$FRONTEND_CF_DISTRO_ID" --paths "/*"

  deploy-prod-backend:
    if: startsWith(github.ref_name, 'r-') # the prefix we have added to the tag
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC connecting to AWS
      contents: read
    steps:
      - name: Download ECR tag artifact
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          version: ${{ github.event.release.id }}
          file: new_ecr_tag.txt
      
      - name: Download Pulumi IaC artifact
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          version: ${{ github.event.release.id }}
          file: pulumi.tbz
      
      - name: Extract ECR tag from artifact
        id: pulumi-tag-extract
        run: |
          echo "pulumi_tag=$(cat new_ecr_tag.txt)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (Pulumi)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: "true"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13

      # Pulumi.yaml uses the uv toolchain: the program's dependencies install from
      # pulumi/uv.lock. UV_LOCKED (below) fails the deploy if the lock is stale.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'

      - name: Set up Pulumi environment
        id: pulumi-env
        shell: bash
        # Uses the Pulumi CLI preinstalled on the runner image (as deploy-staging.yml
        # already does) instead of piping the get.pulumi.com installer into sh.
        run: |
          tar -xvf pulumi.tbz
          pulumi version

      - name: Deploy to prod
        shell: bash
        env:
          PULUMI_ACCESS_TOKEN: "${{ secrets.PULUMI_ACCESS_TOKEN }}"
          PULUMI_CONFIG_PASSPHRASE: "${{ secrets.PULUMI_PASSPHRASE }}"
          UV_LOCKED: "1"
          PULUMI_TAG: "${{ steps.pulumi-tag-extract.outputs.pulumi_tag }}"
        run: |
          # Create a YAML config stump containing only the new image tag as a YAML variable
          cd pulumi
          echo ".apmt_image: &APMT_IMAGE $PULUMI_TAG" > newimage.yaml

          # Use yq to merge the stump into the main config
          yq -i '. *= load("newimage.yaml")' config.prod.yaml

          # Set up the Pulumi environment and update the service
          pulumi login
          pulumi stack select prod
          TBPULUMI_DISABLE_PROTECTION=True \
            pulumi up -y --diff \
            --target 'urn:pulumi:prod::appointment::tb:fargate:FargateClusterWithLogging$aws:ecs/taskDefinition:TaskDefinition::appointment-prod-fargate-backend-taskdef' \
            --target 'urn:pulumi:prod::appointment::tb:fargate:AutoscalingFargateCluster::appointment-prod-afc-appointment' \
            --target-dependents

  prod-sanity-browserstack:
    name: prod-sanity-browserstack
    needs: [deploy-prod-backend, deploy-prod-frontend]
    runs-on: ubuntu-latest
    environment: production
    env:
      TB_ACCTS_EMAIL: ${{ secrets.E2E_APPT_PROD_TB_ACCTS_EMAIL }}
      TB_ACCTS_PWORD: ${{ secrets.E2E_APPT_PROD_TB_ACCTS_PWORD }}
      APPT_DISPLAY_NAME: ${{ secrets.E2E_APPT_PROD_DISPLAY_NAME }}
      APPT_MY_SHARE_LINK: ${{ secrets.E2E_APPT_PROD_MY_SHARE_LINK }}
      APPT_BOOKEE_NAME: ${{ secrets.E2E_APPT_PROD_BOOKEE_NAME }}
      APPT_BOOKEE_EMAIL: ${{ secrets.E2E_APPT_PROD_BOOKEE_EMAIL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'test/e2e/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd ./test/e2e
          pnpm install --frozen-lockfile

      - name: BrowserStack Env Setup
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # master
        with:
          username:  ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project-name: 'Thunderbird Appointment'
          build-name: 'Production Deployment Tests: BUILD_INFO'

      - name: Production Sanity E2E Tests on Desktop Firefox
        run: |
          cd ./test/e2e
          cp .env.prod.example .env
          pnpm run prod-sanity-test-browserstack-firefox
