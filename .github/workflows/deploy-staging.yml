name: deploy-staging-and-create-release

concurrency:
  group: deploy-staging
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy-stage-frontend:
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC connecting to AWS
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build stage frontend
        run: |
          rm -rf frontend/dist  # Clean up from previous build
          cp frontend/.env.stage.example frontend/.env.stage
          cd frontend && pnpm run build --mode ${{ vars.APP_ENV }}

      - name: Deploy frontend to S3
        env:
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
          FRONTEND_CF_DISTRO_ID: ${{ secrets.FRONTEND_CF_DISTRO_ID }}
        run: |
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET"
          aws cloudfront create-invalidation --distribution-id "$FRONTEND_CF_DISTRO_ID" --paths '/*'

  build-backend-image:
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC connecting to AWS
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (Pulumi)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      - name: Build, tag, and push backend image to Amazon ECR
        id: build-backend
        env:
          ECR_TAG: '${{ steps.login-ecr.outputs.registry }}/thunderbird/appointment:${{ github.sha }}'
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build --build-arg "RELEASE_VERSION=$RELEASE_VERSION" -t $ECR_TAG ./backend -f ./backend/Dockerfile
          docker push $ECR_TAG
          echo "image_backend=$ECR_TAG" >> $GITHUB_OUTPUT
          echo $ECR_TAG > new_ecr_tag.txt

      - name: Archive ECR tag
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: new_ecr_tag
          path: new_ecr_tag.txt

  deploy-stage-backend:
    needs:
      - build-backend-image
    if: needs.build-backend-image.result == 'success'
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC connecting to AWS
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download ecr tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
            name: 
              new_ecr_tag

      - name: Configure AWS credentials for Pulumi
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: "true"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13

      # Pulumi.yaml uses the uv toolchain: the program's dependencies install from
      # pulumi/uv.lock. UV_LOCKED (below) fails the deploy if the lock is stale.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'

      - name: Unpack ECR tag
        id: get_ecr_tag
        run: |
          output=$(cat new_ecr_tag.txt)
          echo new_ecr_tag=$output >> $GITHUB_OUTPUT

      # Deploy to stage
      - name: Deploy new image to stage
        shell: bash
        env:
          ECR_TAG: "${{ steps.get_ecr_tag.outputs.new_ecr_tag }}"
          PULUMI_ACCESS_TOKEN: "${{ secrets.PULUMI_ACCESS_TOKEN }}"
          PULUMI_CONFIG_PASSPHRASE: "${{ secrets.PULUMI_PASSPHRASE }}"
          UV_LOCKED: "1"
        run: |
          # Update the PATH to include the right version of Pulumi; this is non-trivial or impossible
          # to do with the GHA workflow "env" settings above.
          export PATH="/home/runner/.pulumi/bin:$PATH"

          cd pulumi

          # Create a YAML config stump containing only the new image tag as a YAML variable
          echo ".apmt_image: &APMT_IMAGE $ECR_TAG" > newimage.yaml

          # Use yq to merge the stump into the main config
          yq -i '. *= load("newimage.yaml")' config.stage.yaml

          # Set up the Pulumi environment and update the service
          pulumi login
          pulumi stack select stage
          pulumi up -y --diff \
            --target 'urn:pulumi:stage::appointment::tb:fargate:FargateClusterWithLogging$aws:ecs/taskDefinition:TaskDefinition::appointment-stage-fargate-backend-taskdef' \
            --target 'urn:pulumi:stage::appointment::tb:fargate:AutoscalingFargateCluster::appointment-stage-afc-appointment' \
            --target-dependents

  create-release:
    needs:
      - build-backend-image
      - build-and-deploy-stage-frontend
      - deploy-stage-backend
    if: |
      always() &&
      contains(join(needs.*.result, ','), 'success') &&
      ! contains(join(needs.*.result, ','), 'failure')
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write # This is required to create a release

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build prod frontend
        run: |
          cp frontend/.env.prod.example frontend/.env.prod
          cd frontend && pnpm run build --mode ${{ vars.APP_ENV }}
          zip -r ../frontend.zip dist

      - name: Download ECR tag
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
            name: 
              new_ecr_tag
      
      - name: Zip Pulumi
        run: |
          # Remove any lingering build pieces that may exist
          pushd pulumi
          rm -rf appointment_pulumi.egg-info build __pycache__ .ruff_cache venv
          popd

          # Tarbizz the Pulumi IaC
          tar -cvjf pulumi.tbz pulumi/

      - name: Create release tag
        id: create-release-tag
        run: echo "tag_name=r-$(printf %04d $GITHUB_RUN_NUMBER)" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.create-release-tag.outputs.tag_name }}
          name: Release ${{ steps.create-release-tag.outputs.tag_name }}
          body: |
            ## Info
            Commit ${{ github.sha }} was deployed to `stage`. [See code diff](${{ github.event.compare }}).

            It was initialized by [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}).

            ## How to Promote?
            In order to promote this to prod, edit the draft and press **"Publish release"**.
          draft: true
          files: |
            new_ecr_tag.txt
            frontend.zip
            pulumi.tbz

  e2e-tests-browserstack-stage:
    name: e2e-tests-browserstack-stage
    needs: create-release
    if: ${{ success() && !cancelled() }} # only proceed if last steps passed and job hasn't been cancelled
    runs-on: ubuntu-latest
    environment: staging
    env:
      TB_ACCTS_EMAIL: ${{ secrets.E2E_APPT_STAGE_TB_ACCTS_EMAIL }}
      TB_ACCTS_PWORD: ${{ secrets.E2E_APPT_STAGE_TB_ACCTS_PWORD }}
      APPT_DISPLAY_NAME: ${{ secrets.E2E_APPT_STAGE_DISPLAY_NAME }}
      APPT_MY_SHARE_LINK: ${{ secrets.E2E_APPT_STAGE_MY_SHARE_LINK }}
      APPT_BOOKEE_NAME: ${{ secrets.E2E_APPT_STAGE_BOOKEE_NAME }}
      APPT_BOOKEE_EMAIL: ${{ secrets.E2E_APPT_STAGE_BOOKEE_EMAIL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'test/e2e/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd ./test/e2e
          pnpm install --frozen-lockfile

      - name: BrowserStack Env Setup
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f # master
        with:
          username:  ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project-name: 'Thunderbird Appointment'
          build-name: 'E2E Tests: BUILD_INFO'

      - name: Stage Sanity E2E Tests on Desktop Firefox
        run: |
          cd ./test/e2e
          cp .env.stage.example .env
          pnpm run stage-sanity-test-browserstack-firefox
